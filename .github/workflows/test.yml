name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'part_2/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r part_2/requirements.txt

      - name: Run Pytest Test Suite
        run: |
          python part_2/manage.py migrate --noinput
          python -m pytest tests/

      - name: Run Django App Tests
        run: |
          cd part_2
          python manage.py test apps.handovers.tests
