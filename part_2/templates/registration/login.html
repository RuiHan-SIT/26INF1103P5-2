
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Handover Auditor | Login</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}?v=2">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <h1>AI Handover Assistant</h1>
                <p>Smart. Secure. Seamless.</p>
            </div>

            <div class="welcome-text", align="center">
                <h2>Welcome</h2>
                <p>Please enter your details to continue.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">                                                                                                                                                                                                                                             

                <div class="form-group">
                    <label for="id_username">Employee ID</label>
                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        placeholder="Enter your employee ID"
                        required
                    >
                    {% if form.errors %}
                        <p class="error-message">Invalid username or password. Please try again.</p>
                    {% endif %}
                </div>

                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

        </div>

    </div>

</body>
</html>
