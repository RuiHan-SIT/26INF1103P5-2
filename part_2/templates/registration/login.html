
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Handover Auditor | Login</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}?v=4">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <h1>AI Handover Assistant</h1>
                <p>Smart. Secure. Seamless.</p>
            </div>

            <div class="welcome-text", align="center">
                <h2>Welcome</h2>
                <p>Please enter your details to continue.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">                                                                                                                                                                                                                                             

                <div class="form-group">
                    <label for="id_username">Employee ID</label>
                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        placeholder="Enter your employee ID"
                        required
                    >
                    {% if form.errors %}
                        <p class="error-message">Invalid username or password. Please try again.</p>
                    {% endif %}
                </div>

                <div class="form-group">
                    <label for="id_password">Password</label>
                    <div class="password-input-wrap">
                        <input
                            type="password"
                            name="password"
                            id="id_password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button class="password-toggle" id="togglePassword" type="button"
                            aria-label="Show password" aria-controls="id_password" aria-pressed="false" data-visible="false">
                            <svg data-eye-open viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg data-eye-closed viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M3 3l18 18"></path>
                                <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4.1-.8"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

        </div>

    </div>

    <script src="{% static 'js/login.js' %}?v=2" defer></script>
</body>
</html>
