{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Account security{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}?v=10">
</head>
<body>
    <main class="login-container">
        <section class="login-card password-card">
            <div class="logo">
                <h1>AI Handover Assistant</h1>
                <p>Account security</p>
            </div>
            <div class="welcome-text">
                <h2>{% block heading %}{% endblock %}</h2>
                <p>{% block intro %}{% endblock %}</p>
            </div>
            {% block page_content %}{% endblock %}
        </section>
    </main>
</body>
</html>
